apply plugin: 'com.android.application'

android {
    namespace 'ir.hojoom.game'
    compileSdk 34

    defaultConfig {
        applicationId "ir.hojoom.game"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("keystore/release.keystore")
            storePassword "Hojoom@2026Key!"
            keyAlias "hojoomkey"
            keyPassword "Hojoom@2026Key!"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    def tapsellPlus = "2.3.2"
    implementation("ir.tapsell.plus:tapsell-plus-sdk-android:$tapsellPlus")
}

// The Tapsell SDK pulls in an old kotlin-stdlib-jdk7/jdk8 (1.6.21) while
// other dependencies pull the newer kotlin-stdlib (1.8.22). Since Kotlin
// 1.8, the jdk7/jdk8 artifacts are thin shims over kotlin-stdlib, so mixing
// versions produces duplicate classes at merge time. Forcing every Kotlin
// stdlib artifact to the same version fixes the "Duplicate class kotlin...."
// build failure.
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22"
    }
}
